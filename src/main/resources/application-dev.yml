server:
  port: 8080

spring:
  application:
    name: leitao-angola

  datasource:
    url: jdbc:postgresql://localhost:5433/lelo_angola
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: "leloAngolaSecretKey1234567890ForDevelopmentOnly"
  expiration: 86400000
  refresh-expiration: 604800000
